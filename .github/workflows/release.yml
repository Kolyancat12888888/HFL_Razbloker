name: Enterprise Release CI/CD

on:
  push:
    branches: [ "master", "main" ]
    paths-ignore:
      - '**.md'
      - '.gitignore'
  workflow_dispatch:
    inputs:
      force_version:
        description: 'Override Version (e.g. 1.0.0)'
        required: false
        type: string

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Determine Next Semantic Version (30-step rollover)
        id: versioning
        shell: pwsh
        run: |
          if ("${{ github.event.inputs.force_version }}" -ne "") {
            $version = "${{ github.event.inputs.force_version }}"
            Write-Host "Forced version: $version"
            echo "version=$version" >> $env:GITHUB_OUTPUT
            echo "tag=v$version" >> $env:GITHUB_OUTPUT
            exit 0
          }

          # Get latest git tag
          $latestTag = git describe --tags --abbrev=0 2>$null
          if (-not $latestTag) {
            $version = "1.0.0"
          } else {
            $cleanTag = $latestTag.TrimStart('v')
            $parts = $cleanTag.Split('.')
            if ($parts.Length -lt 3) {
              $major = 1; $minor = 0; $patch = 0
            } else {
              $major = [int]$parts[0]
              $minor = [int]$parts[1]
              $patch = [int]$parts[2]
            }

            # Custom Versioning Rule:
            # If patch reaches 30, next is (minor + 1).1
            # If minor reaches 30, next is (major + 1).1.1
            if ($patch -ge 30) {
              $patch = 1
              $minor += 1
              if ($minor -ge 30) {
                $minor = 1
                $major += 1
              }
            } else {
              $patch += 1
            }

            $version = "$major.$minor.$patch"
          }

          Write-Host "Calculated Next Release Version: $version"
          echo "version=$version" >> $env:GITHUB_OUTPUT
          echo "tag=v$version" >> $env:GITHUB_OUTPUT

      - name: Restore Client Dependencies
        run: dotnet restore src/HFL.Client/HFL.Client.csproj

      - name: Build & Publish Client (Single-File Self-Contained x64)
        run: |
          dotnet publish src/HFL.Client/HFL.Client.csproj `
            -c Release `
            -r win-x64 `
            --self-contained true `
            -p:PublishSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            -p:EnableCompressionInSingleFile=true `
            -p:Version=${{ steps.versioning.outputs.version }} `
            -p:AssemblyVersion=${{ steps.versioning.outputs.version }} `
            -p:FileVersion=${{ steps.versioning.outputs.version }} `
            -o ./publish/client

      - name: Package Release Artifacts
        shell: pwsh
        run: |
          $ver = "${{ steps.versioning.outputs.version }}"
          $zipName = "HFL_Razbloker_v$ver.zip"
          Compress-Archive -Path ./publish/client/* -DestinationPath "./$zipName"
          Copy-Item ./publish/client/HFL_Razbloker.exe -Destination "./HFL_Razbloker.exe"

      - name: Create Git Tag & Push
        shell: pwsh
        run: |
          $tag = "${{ steps.versioning.outputs.tag }}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag $tag
          git push origin $tag

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.versioning.outputs.tag }}
          name: "HFL Razbloker Enterprise ${{ steps.versioning.outputs.tag }}"
          body: |
            ## 🚀 HFL Razbloker Enterprise Release ${{ steps.versioning.outputs.tag }}
            
            ### ✨ Возможности:
            - 🛡️ **Автономный Intelligent Unblocker Engine («Швейцарские часы»)** с пингом <80мс.
            - ⚡ **Локальный обход DPI (Zapret / winws / WinDivert)** без прокси для максимальной скорости.
            - 🌐 **3X-UI Enterprise Integration** (VLESS Reality / TUN Mode / XTLS / Low Latency Direct RU Split).
            - 🔒 **Защищенный кастомный DoH (DNS-over-HTTPS)** с защитой от DNS-спуфинга.
            - 🔑 **Аппаратная система лицензирования (HWID Binding)** с Telegram-ботом.
            
            ### 📦 Файлы для скачивания:
            - `HFL_Razbloker.exe` — одиночный исполняемый файл (не требует установки .NET).
            - `HFL_Razbloker_v${{ steps.versioning.outputs.version }}.zip` — полный портативный архив.
          files: |
            ./HFL_Razbloker.exe
            ./HFL_Razbloker_v${{ steps.versioning.outputs.version }}.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
