# /etc/nginx/sites-available/hfl-local.conf
# Nginx virtual host for *.local and *.internal diagnostics

server {
    listen 80;
    listen 31.77.8.9:80;
    listen 443 ssl;
    listen 31.77.8.9:443 ssl;
    server_name test.local *.local *.internal;

    # Self-signed certificate or default ssl fallback
    ssl_certificate /etc/ssl/certs/ssl-cert-snakeoil.pem;
    ssl_certificate_key /etc/ssl/private/ssl-cert-snakeoil.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    root /var/www/hfl-local;
    index index.html;

    # Enable Server Side Includes (SSI) for instant nginx variable rendering
    ssi on;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/info {
        default_type application/json;
        return 200 '{"domain":"$host","clientIp":"$remote_addr","serverIp":"$server_addr","scheme":"$scheme","uri":"$request_uri"}';
    }

    # API and DoH Reverse Proxy to HFL .NET backend (port 5000)
    location /dns-query {
        proxy_pass http://127.0.0.1:5000/dns-query;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:5000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
