# /etc/nginx/sites-available/hfl-panel.conf
# Dedicated Virtual Host for HFL WebPanel Enterprise on hfl-control-panel.internal and panel.local

server {
    listen 80;
    listen 31.77.8.9:80;
    listen 443 ssl;
    listen 31.77.8.9:443 ssl;
    server_name hfl-control-panel.internal panel.internal panel.local;

    ssl_certificate /etc/ssl/certs/ssl-cert-snakeoil.pem;
    ssl_certificate_key /etc/ssl/private/ssl-cert-snakeoil.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    root /var/www/hfl-panel;
    index index.html index.php;

    charset utf-8;
    client_max_body_size 512M;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Laravel Backend API Proxy (port 5000)
    location /api/ {
        proxy_pass http://127.0.0.1:5000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # DoH DNS Query Endpoint
    location /dns-query {
        proxy_pass http://127.0.0.1:5000/dns-query;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
