<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HFL Razbloker Diagnostics</title>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #0b0e14;
            --card-bg: rgba(22, 27, 34, 0.85);
            --card-border: rgba(56, 189, 248, 0.2);
            --neon-blue: #38bdf8;
            --neon-purple: #c084fc;
            --neon-green: #4ade80;
            --text: #f1f5f9;
            --text-dim: #94a3b8;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'JetBrains Mono', monospace, -apple-system, sans-serif;
        }

        body {
            background-color: var(--bg);
            background-image: 
                radial-gradient(circle at 15% 15%, rgba(56, 189, 248, 0.12) 0%, transparent 40%),
                radial-gradient(circle at 85% 85%, rgba(192, 132, 252, 0.12) 0%, transparent 40%);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 680px;
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 20px;
            padding: 36px;
            backdrop-filter: blur(16px);
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6), 0 0 30px rgba(56, 189, 248, 0.1);
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
        }

        .badge {
            display: inline-block;
            background: rgba(74, 222, 128, 0.15);
            border: 1px solid rgba(74, 222, 128, 0.35);
            color: var(--neon-green);
            padding: 4px 14px;
            border-radius: 9999px;
            font-size: 0.8rem;
            font-weight: 600;
            letter-spacing: 1px;
            text-transform: uppercase;
            margin-bottom: 12px;
        }

        .title {
            font-size: 1.8rem;
            font-weight: 800;
            background: linear-gradient(135deg, var(--neon-blue), var(--neon-purple));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 8px;
        }

        .subtitle {
            color: var(--text-dim);
            font-size: 0.9rem;
        }

        .grid {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .item {
            background: rgba(15, 23, 42, 0.7);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 14px;
            padding: 16px 20px;
            display: flex;
            flex-direction: column;
            gap: 6px;
            transition: all 0.2s ease;
        }

        .item:hover {
            border-color: rgba(56, 189, 248, 0.4);
            transform: translateY(-2px);
        }

        .item-label {
            font-size: 0.75rem;
            text-transform: uppercase;
            color: var(--text-dim);
            letter-spacing: 0.5px;
        }

        .item-value {
            font-size: 1.25rem;
            font-weight: 600;
            color: var(--neon-blue);
            word-break: break-all;
        }

        .highlight-green {
            color: var(--neon-green);
        }

        .highlight-purple {
            color: var(--neon-purple);
        }

        .footer {
            margin-top: 30px;
            text-align: center;
            font-size: 0.8rem;
            color: var(--text-dim);
            border-top: 1px solid rgba(255, 255, 255, 0.06);
            padding-top: 20px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <span class="badge">● DNS Redirection Active</span>
            <h1 class="title">HFL Enterprise Gateway</h1>
            <p class="subtitle">Диагностическая страница сетевого подключения</p>
        </div>

        <div class="grid">
            <div class="item">
                <span class="item-label">🌐 Запрошенный домен (Host)</span>
                <span class="item-value highlight-purple" id="val-host"><!--# echo var="http_host" default="" --></span>
            </div>

            <div class="item">
                <span class="item-label">👤 Ваш реальный IP-клиента</span>
                <span class="item-value highlight-green" id="val-client-ip"><!--# echo var="remote_addr" default="" --></span>
            </div>

            <div class="item">
                <span class="item-label">📡 Сервер обработки (Gateway IP)</span>
                <span class="item-value" id="val-server-ip"><!--# echo var="server_addr" default="" --></span>
            </div>

            <div class="item">
                <span class="item-label">🔒 Протокол и DNS Шлюз</span>
                <span class="item-value" id="val-dns">HFL UDP 53 / RFC 1035 (DoH Enabled)</span>
            </div>
        </div>

        <div class="footer">
            HFL Razbloker Enterprise &copy; 2026 &bull; In-Flight Transparent DNS
        </div>
    </div>

    <script>
        // Fallback for JS rendering if SSI is not enabled
        if (!document.getElementById('val-host').textContent.trim()) {
            document.getElementById('val-host').textContent = window.location.host || window.location.hostname;
        }
        if (!document.getElementById('val-server-ip').textContent.trim()) {
            document.getElementById('val-server-ip').textContent = "31.77.8.9";
        }
        // Fetch client public IP from Web API if SSI remote_addr was empty
        if (!document.getElementById('val-client-ip').textContent.trim()) {
            fetch('https://api.ipify.org?format=json')
                .then(r => r.json())
                .then(d => { document.getElementById('val-client-ip').textContent = d.ip; })
                .catch(() => { document.getElementById('val-client-ip').textContent = "Detected via local proxy"; });
        }
    </script>
</body>
</html>
